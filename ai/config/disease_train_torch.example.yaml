train:
  source: ./data/disease_labels.sample.csv
  source_type: csv
  image_root: ./data
  labels_path: ./config/disease_labels.example.yaml

  output_checkpoint_path: ./models/disease_classifier_leaves.pt
  output_label_map_path: ./models/disease_label_mapping.json

  backbone: mobilenet_v3_small
  pretrained: false
  image_size: 224

  epochs: 8
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0

  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  device: auto
  use_augmentation: true

# TODO: 生产环境建议加早停、学习率调度、混合精度配置。
